name: Productonderzoek tests
on:
  pull_request:
    paths:
      - 'nv_product_discovery.py'
      - 'nv_product_margin.py'
      - 'app.py'
      - 'templates/dashboard.html'
      - 'tests/test_nv_*.py'
      - '.github/workflows/productonderzoek-tests.yml'
  push:
    branches:
      - 'feature/ai-productonderzoek-20261116'
    paths:
      - 'nv_product_discovery.py'
      - 'nv_product_margin.py'
      - 'app.py'
      - 'templates/dashboard.html'
      - 'tests/test_nv_*.py'
      - '.github/workflows/productonderzoek-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py nv_product_discovery.py nv_product_margin.py
      - name: Productonderzoek unit tests
        run: python -m unittest discover -s tests -p 'test_nv_*.py' -v
      - name: Check Jinja template parses
        run: python -c "from jinja2 import Environment; Environment().parse(open('templates/dashboard.html', encoding='utf-8').read()); print('Template syntax OK')"
