
<script>/* NUVEMIXA 2026-11-20v: Engelse hero-afbeeldingen bij taal EN */(function(){var M={'gadgets.jpg':'gadgets-en.jpg','smart-home.png':'smart-home-en.jpg','beauty-care.png':'beauty-care-en.jpg','lifestyle-sport.jpg':'lifestyle-sport-en.jpg','aanbiedingen.png':'aanbiedingen-en.jpg','alle-producten.png':'alle-producten-en.jpg'};function lang(){var l='';try{l=localStorage.getItem('trendmix-language')||''}catch(e){}return (l||document.documentElement.lang||'nl').slice(0,2).toLowerCase()}function run(){var en=lang()==='en';var imgs=document.querySelectorAll('img[src*="/images/hero/"]');for(var k=0;k<imgs.length;k++){var i=imgs[k];if(!i.getAttribute('data-nv-nl')){var s=i.getAttribute('src');var m=s.match(/hero\/([^?#]+)/);if(!m||!M[m[1]])continue;i.setAttribute('data-nv-nl',s);i.setAttribute('data-nv-en','/static/images/hero/'+M[m[1]]+'?v=20261120v')}var t=en?i.getAttribute('data-nv-en'):i.getAttribute('data-nv-nl');if(i.getAttribute('src')!==t){i.setAttribute('src',t);i.removeAttribute('srcset')}}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();try{new MutationObserver(run).observe(document.documentElement,{attributes:true,attributeFilter:['lang']})}catch(e){}document.addEventListener('click',function(e){if(e.target&&e.target.closest&&e.target.closest('[data-tm-locale-choice],[data-tm-language]'))setTimeout(run,80)});document.addEventListener('change',function(e){if(e.target&&e.target.id==='tmGlobalLanguage')setTimeout(run,80)});window.addEventListener('storage',run)})();</script>
