{% from '_tm_icons.html' import tm_icon %}
<header class="site-header">
  <div class="shell header-main">{% include '_tm_topbar_language.html' %}
    <button class="menu-toggle" type="button" data-tm-menu-trigger aria-label="Menu openen" aria-expanded="false" aria-controls="tmMobileDrawer"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="brand tm-brand" href="/" aria-label="NUVEMIXA home"><img class="nv-brand-image" src="{{ url_for('static', filename='nuvemixa-logo-test.png', v='20261110-logo-test') }}" alt="NUVEMIXA" onerror="this.onerror=null;this.src='/static/logo.svg'"></a>
    <form class="search-bar" action="/" method="get" role="search">
      <svg class="tm-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      <input type="search" name="q" value="{{ search_query|default('') }}" placeholder="Zoek naar producten, merken of specificaties" data-i18n-placeholder="searchProducts" aria-label="Zoek producten">
      <button type="submit" aria-label="Zoeken"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
    </form>
    <div class="tm-ref-actions nv-main-actions"><a href="/account" class="nv-action-account" aria-label="Account">{{ tm_icon('user') }} <small>Account</small></a><a href="/wishlist" class="nv-favorites-link nv-action-favorites" aria-label="Favorieten">{{ tm_icon('heart') }} <small>Favorieten</small><span class="nv-fav-count" data-wishlist-count {% if not wishlist_count %}hidden{% endif %}>{{ wishlist_count }}</span></a></div>
    <a class="cart-link nv-action-cart" href="/winkelwagen" aria-label="Winkelwagen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2 12h11l2-8H6M9 20a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm8 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg><span data-cart-count>{{ cart_count|default(0) }}</span></a>
  </div>
  <nav class="main-nav" data-mobile-nav aria-label="Hoofdnavigatie">
    <div class="shell nav-inner">
      <a href="/gadgets" class="nav-link nav-primary"><span data-category-name="gadgets">Gadgets</span></a>
      <a href="/smart-home" class="nav-link"><span data-category-name="smart-home">Smart Home</span></a>
      <a href="/beauty-care" class="nav-link"><span data-category-name="beauty-care">Beauty & Care</span></a>
      <a href="/home-living" class="nav-link"><span data-category-name="home-living">Home & Living</span></a>
      <a href="/lifestyle-sport" class="nav-link"><span data-category-name="lifestyle-sport">Lifestyle & Sport</span></a>
      <a href="/aanbiedingen" class="nav-link nav-deals">Aanbiedingen</a>
    </div>
  </nav>
</header>
